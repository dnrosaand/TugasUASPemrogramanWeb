<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="login.css">
</head>
<body>
    <section class="logo-section">
        <div class="logo">
            <img src="img/logo.png" alt="annyeongshop">
        </div>
    </section>

    <header>
        <button class="menu">
            ☰
        </button>
        <div class="search">
            <input type="text" placeholder="Search You're Fav">
        </div>
        <div class="header-icon">
            <a href="#">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5
                2 5.42 4.42 3 7.5 3
                c1.74 0 3.41.81 4.5 2.09
                C13.09 3.81 14.76 3 16.5 3
                19.58 3 22 5.42 22 8.5
                c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </a>
            <a href="#">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M7 4H3v2h2l2.4 9.59A2 2 0 0 0 9.35 17H19v-2H9.42l-.27-1H18a2 2 0 0 0 1.94-1.51L22 6H7.42L7 4zm2 15a2 2 0 100 4 2 2 0 000-4zm8 0a2 2 0 100 4 2 2 0 000-4z"/>
                </svg>
            </a>
            <a href="#" id="user-btn">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" height="24" width="24" viewBox="0 0 24 24">
                    <path d="M12 1C5.925 1 1 5.925 1 12s4.925 11 11 11 11-4.925 11-11S18.075 1 12 1Zm0 2a9 9 0 016.447 15.276 7 7 0 00-12.895 0A9 9 0 0112 3Zm0 2a4 4 0 100 8 4 4 0 000-8Zm0 2a2 2 0 110 4 2 2 0 010-4Zm-.1 9.001L11.899 16a5 5 0 014.904 3.61A8.96 8.96 0 0112 21a8.96 8.96 0 01-4.804-1.391 5 5 0 014.704-3.608Z"/>
                </svg>
            </a>
        </div>
    </header>

    <div class="auth-nav">
        <div class="auth-wrapper">
            <a href="index.html" class="auth-item">Beranda</a>
            <a href="login.html" class="auth-item active">Masuk</a>
            <a href="daftar.html" class="auth-item">Daftar</a>
        </div>
    </div>

    <form class="login-form" id="loginForm">
        <div class="form-group">
            <input
            type="email"
            id="email"
            name="email"
            placeholder="Email Address"
            required
            >
        </div>

        <div class="form-group password-group">
            <input
            type="password"
            id="password"
            name="password"
            placeholder="Kata Sandi"
            required
            >

            <button type="button" class="toggle-password">
                <i class="bi bi-eye-slash"></i>
            </button>
        </div>

        <a href="forgot-password.html" class="forgot-password">
            Lupa Password?
        </a>

        <button type="submit" class="login-btn">
            <span>Masuk</span>

            <svg xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">

                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </button>
    </form>

    <footer>
        <div class="footer-logo">
            <img src="img/logo.png" alt="logo">
            <p>© 2026 AnnyeongShop. Seluruh Hak Cipta Dilindungi.</p>
        </div>

        <div class="footer-menu">
            <h4>BANTUAN</h4>
            <a href="#">Hubungi Kami</a>
            <a href="#">FAQ</a>
            <a href="#">Cara Pemesanan</a>
            <a href="#">Informasi Pengiriman</a>
            <a href="#">Kebijakan Pengembalian</a>
        </div>

        <div class="footer-social">
            <h4>IKUTI KAMI</h4>
            <a href="#">Instagram</a>
            <a href="#">Twitter</a>
            <a href="#">TikTok</a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
