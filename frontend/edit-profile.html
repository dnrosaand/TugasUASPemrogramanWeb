<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>

    <link rel="stylesheet" href="edit-profile.css">
</head>
<body>
    <section class="logo-section">
        <div class="logo">
            <img src="img/logo.png" alt="annyeongshop">
        </div>
    </section>

    <div class="edit-wrapper">
        <div class="edit-header">
            <button class="back-btn" onclick="window.location.href='profile.html'">
                ← Kembali
            </button>
            <h1>Edit Profil</h1>
            <p>Perbarui informasi akun kamu di bawah ini.</p>
            <img
            id="previewPhoto"
            src="img/default-user.png"
            alt="Foto Profil"
            class="profile-photo">
            <input
            type="file"
            id="photoInput"
            accept="image/*"
            hidden>
            <button
            type="button"
            class="change-photo-btn"
            onclick="document.getElementById('photoInput').click()">
                Ubah Foto Profil
            </button>
        </div>

        <form class="edit-form" id="editProfileForm">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="fullname">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email">
            </div>
            <div class="form-group">
                <label>Nomor Telepon</label>
                <input type="text" id="phone">
            </div>
            
            <div class="form-group">
                <label>Provinsi</label>
                <input type="text" id="province">
            </div>
            <div class="form-group">
                <label>Kabupaten / Kota</label>
                <input type="text" id="city">
            </div>
            <div class="form-group">
                <label>Kecamatan</label>
                <input type="text" id="district">
            </div>
            <div class="form-group">
                <label>Kelurahan / Desa</label>
                <input type="text" id="village">
            </div>
            <div class="form-group">
                <label>Jalan</label>
                <input type="text" id="street">
            </div>
            <div class="form-group">
                <label>Nomor Rumah</label>
                <input type="text" id="houseNumber">
            </div>
            <div class="form-group">
                <label>RT / RW</label>
                <input type="text" id="rtRw">
            </div>
            <div class="form-group">
                <label>Detail Alamat</label>
                <textarea id="detail" rows="4"></textarea>
            </div>

            <div class="button-group">
                <button type="button"
                    class="cancel-btn"
                    onclick="window.location.href='profile.html'">
                        Batal
                </button>

                <button type="button" id="saveProfile" class="save-btn">
                    Simpan Perubahan
                </button>
            </div>
        </form>
    </div>

    <script src="profile.js"></script>
</body>
</html>
