<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>

    <link rel="stylesheet" href="edit-profile.css">
</head>
<body>
    <section class="logo-section">
        <div class="logo">
            <img src="img/logo.png" alt="annyeongshop">
        </div>
    </section>

    <div class="edit-wrapper">
        <div class="edit-header">
            <button class="back-btn" onclick="window.location.href='profile.html'">
                ← Kembali
            </button>
            <h1>Edit Profil</h1>
            <p>Perbarui informasi akun kamu di bawah ini.</p>
        </div>

        <form class="edit-form" id="editProfileForm">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="fullname">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email">
            </div>
            <div class="form-group">
                <label>Nomor Telepon</label>
                <input type="text" id="phone">
            </div>
            <div class="form-group full-width">
                <label>Alamat</label>
                <textarea id="address" rows="4"></textarea>
            </div>
            <div class="button-group">
                <button type="button"
                    class="cancel-btn"
                    onclick="window.location.href='profile.html'">
                        Batal
                </button>

                <button type="button" id="saveProfile" class="save-btn">
                    Simpan Perubahan
                </button>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
